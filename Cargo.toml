# ════════════════════════════════════════════════════════════════════════
#  PROJECT: settings that belong to this project only
# ════════════════════════════════════════════════════════════════════════
#
# Die Regeln fürs Schreiben von Code stehen in CLAUDE.md und
# docs/guidelines/; diese Datei enthält nur Einstellungen, jede mit Grund.

# Leerer Arbeitsbereich: nötig, damit `[lints] workspace = true` die Lints
# unten erbt.
[workspace]

[package]
name = "diktator"
version = "0.1.0"
publish = false
edition = "2024"
# Dieselbe Version wie in `rust-toolchain.toml`; beide zusammen anheben
# (docs/guidelines/update.md).
rust-version = "1.99.1"
description = "Diktator: lokales Diktieren in jede App und YouTube-Transkripte (Cohere Transcribe)"

[[bin]]
name = "diktator"
path = "src/main.rs"

[dependencies]
# Spracherkennung: Cohere Transcribe als GGUF über transcribe.cpp (Metal).
transcribe-cpp = "0.4"
# Mikrofonaufnahme.
cpal = "0.18"
# Abtastrate des Mikrofons (meist 48 kHz) auf die 16 kHz des Modells bringen.
rubato = "5"
# Zwischenablage sichern, Transkript einsetzen, alten Inhalt wiederherstellen.
arboard = "3.6"
# fn-Taste global abfangen (CGEventTap) und ⌘V auslösen.
core-graphics = "0.25"
# Laufschleife (CFRunLoop), in der die Tastenabfrage ihre Ereignisse bekommt.
core-foundation = "0.10"
# Ablageorte (~/Library/Application Support/Diktator).
dirs = "7"
# Ortszeit für das Protokoll.
jiff = "0.2"
# Fehler als Enums (Regel 3 in CLAUDE.md).
thiserror = "2"
# Wörterbuch und Einstellungen (TOML) lesen.
toml = "1.1"
# Einstellungen, Wörterbuch und Nachrichten als Rust-Typen lesen und schreiben.
serde = { version = "1", features = ["derive"] }
# Nachrichten an die Oberfläche (Swift-Hilfsprogramm), eine JSON-Zeile je Nachricht.
serde_json = "1"
# Sicherheitsnetz fürs Überarbeiten: Wortfolgen vergleichen (Diff).
similar = { version = "3", default-features = false }
# Sicherheitsnetz fürs Überarbeiten: ähnliche Schreibweisen (Levenshtein).
strsim = "0.11"
# HTTP zum lokalen llama-server (Überarbeiten mit einem lokalen Modell).
# Nur `http://127.0.0.1`, daher ohne die Standard-Features TLS und gzip.
ureq = { version = "3", default-features = false, features = ["json"] }
# Eine ganze Prozessgruppe beenden (Kindprozess samt Enkeln) und mit
# Zeitgrenze auf die Pipe des Wächters warten (`poll`), ohne `unsafe`.
# `std` ist nötig: erst damit nimmt `poll` die `AsFd` der Standardbibliothek
# an und `Errno` wird per `?` zu `io::Error`. Ohne kam es bisher nur über
# andere Abhängigkeiten herein, der macOS-Build allein scheiterte.
rustix = { version = "1.1", default-features = false, features = ["event", "process", "std"] }

[dev-dependencies]
# Eigenschaftstests für Textumformungen: das Sicherheitsnetz des
# Überarbeitens und die Textregeln (Zerlegen in Wörter, Normzitate);
# zufällige Eingaben statt einzelner Beispiele (docs/guidelines/testing.md).
# Ohne die Standard-Features fork und timeout, die nur Prozesse und
# Dateien mitbringen.
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true

# ────────────────────────────────────────────────────────────────────────
#  Build profiles
# ────────────────────────────────────────────────────────────────────────

# Auch in dev voll optimiert: Resampling, Stille-Erkennung und lange
# Transkripte wären unoptimiert spürbar langsam. Der Preis sind längere
# Compile-Zeiten. Für den Debugger: `CARGO_PROFILE_DEV_DEBUG=full`.
[profile.dev]
opt-level = 3
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 3

# Native app or CLI: runtime speed.
[profile.release]
opt-level = 3
# Whole-program optimisation: slow to build, faster and smaller result.
lto = "fat"
codegen-units = 1
# No unwinding machinery. Tests and benches ignore this and still unwind.
# Drop does not run on a panic: see processes.md.
panic = "abort"
# A safety net behind `arithmetic_side_effects`, which only guards boundary
# modules: an overflow stops the program instead of computing on.
overflow-checks = true
# Keep symbol names so crash reports and the panic hook stay readable.
strip = "debuginfo"

# Profiling (samply, Instruments, dhat): release code with full symbols.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"

# cargo-mutants builds every mutant; no debug info keeps that fast
# (.cargo/mutants.toml selects it).
[profile.mutants]
inherits = "test"
debug = "none"
# Every mutant rebuilds the crate; at the opt-level 3 of dev that takes
# minutes. The tests are fast enough at 1.
opt-level = 1

# ────────────────────────────────────────────────────────────────────────
#  RUST AND RUSTDOC LINTS
# ────────────────────────────────────────────────────────────────────────
# `deny`, not `forbid`, so a justified exception can be an `#[expect]`.
# Warnings (unused code, unused variables …) stay warnings while drafting;
# scripts/check.sh turns every warning into an error (CARGO_BUILD_WARNINGS).
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
# A Result dropped by a bare `f();` is otherwise only a warning.
unused_must_use = "deny"
# A stale `#[expect]` fails instead of hiding a fixed problem.
unfulfilled_lint_expectations = "deny"
# `-1_i32.abs()` is `-(1.abs())`.
ambiguous_negative_literals = "deny"
# A pub type in a private module leaking through a signature.
unnameable_types = "deny"
missing_debug_implementations = "deny"
# Names are English.
non_ascii_idents = "deny"
deprecated_in_future = "deny"
let_underscore_drop = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
redundant_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_qualifications = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"
unescaped_backticks = "deny"

# ────────────────────────────────────────────────────────────────────────
#  CLIPPY LINTS
# ────────────────────────────────────────────────────────────────────────
# The stable groups are on `deny`. `nursery` is not: its lints are unfinished
# by definition (false positives, contradictions with the rules); the useful
# ones are picked below. `restriction` cannot be enabled as a whole; its
# lints are picked one by one. Thresholds and path bans are in clippy.toml.
[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Duplicate versions deep in the dependency tree are not ours to fix.
multiple_crate_versions = "allow"
# Rewrites `match` on an Option into `map_or_else` (CLAUDE.md, rule 2).
option_if_let_else = "allow"
# Suggests `assert!` in production code (rule 3).
manual_assert = "allow"

# --- Picked from nursery ---
redundant_clone = "deny"
significant_drop_in_scrutinee = "deny"
fallible_impl_from = "deny"
debug_assert_with_mut_call = "deny"
collection_is_never_read = "deny"
path_buf_push_overwrite = "deny"
read_zero_byte_vec = "deny"
non_send_fields_in_send_ty = "deny"
unused_peekable = "deny"
branches_sharing_code = "deny"
needless_collect = "deny"

# --- No panics (rule 3) ---
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"
indexing_slicing = "deny"
string_slice = "deny"
as_conversions = "deny"
# Off globally, on per boundary module: `#![deny(clippy::arithmetic_side_effects)]`
# where code computes on outside input (rule 3).
arithmetic_side_effects = "allow"

# --- No silent failures (rule 3) ---
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
unused_result_ok = "deny"
map_err_ignore = "deny"
assertions_on_result_states = "deny"
try_err = "deny"
return_and_then = "deny"

# --- Types and control flow (rules 1, 2) ---
wildcard_enum_match_arm = "deny"
unnecessary_rest_pattern = "deny"
rest_pattern_accessible_field = "deny"
iter_over_hash_type = "deny"
infinite_loop = "deny"
else_if_without_else = "deny"
shadow_unrelated = "deny"
partial_pub_fields = "deny"
empty_structs_with_brackets = "deny"
empty_enum_variants_with_brackets = "deny"
non_zero_suggestions = "deny"
# Dioxus: `#[component]` trips this on every component; relax it there.
same_name_method = "deny"
empty_drop = "deny"

# --- Ownership and concurrency (rule 4) ---
clone_on_ref_ptr = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
mem_forget = "deny"
str_to_string = "deny"

# --- Numbers and bits ---
float_cmp_const = "deny"
lossy_float_literal = "deny"
precedence_bits = "deny"
suspicious_xor_used_as_pow = "deny"
host_endian_bytes = "deny"

# --- Files ---
filetype_is_file = "deny"
verbose_file_reads = "deny"

# --- Tests (fakes behind traits, not cfg) ---
cfg_not_test = "deny"
tests_outside_test_module = "deny"
redundant_test_prefix = "deny"

# --- unsafe, where an `#[expect(unsafe_code)]` allows it ---
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"

# --- Hygiene ---
dbg_macro = "deny"
string_add = "deny"
redundant_type_annotations = "deny"
renamed_function_params = "deny"
mixed_read_write_in_expression = "deny"
deref_by_slicing = "deny"
unnecessary_self_imports = "deny"
self_named_module_files = "deny"

# --- Suppressions are explicit (rule 0) ---
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
